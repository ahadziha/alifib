[package]
name = "alifib-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line frontend for the alifib interpreter."

# The binary is named `alifib`; the package is `alifib-cli` because Cargo
# requires unique package names in a workspace.
[[bin]]
name = "alifib"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
alifib = { path = ".." }
rustyline = "14"
serde_json = "1"
