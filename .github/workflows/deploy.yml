name: Deploy web interface to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            web/wasm -> target

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build WASM
        # --out-dir is relative to the crate dir, so ../frontend/pkg lands in web/frontend/pkg/
        run: wasm-pack build --target web --release web/wasm --out-dir ../frontend/pkg

      - name: Bundle frontend JS and mirror examples
        # Compiling alifib-cli runs its build script, which bundles
        # web/frontend/dist/app.js with npm. static_examples then mirrors
        # examples/ recursively with the server's scanner and index.json.
        run: cargo run -p alifib-cli --example static_examples -- examples web/frontend/examples

      - name: Assemble dist/
        # Only the runtime pieces, staged as `just web-zip` stages them;
        # a stub bundle from a failed frontend build is refused.
        run: bash scripts/stage_web.sh dist

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
