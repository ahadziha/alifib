[workspace]
members = ["cli"]
# Running `cargo build` / `cargo run` / `cargo test` from the workspace root
# defaults to the CLI binary and its library dependency.
default-members = ["cli"]

[package]
name = "alifib"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]

[dependencies]
ariadne = "0.6.0"
chumsky = "0.12.0"
indexmap = "2"
rand_xoshiro = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = { version = "1", features = ["filters"] }

[[example]]
name = "trace_search"
path = "analysis/trace_search.rs"
